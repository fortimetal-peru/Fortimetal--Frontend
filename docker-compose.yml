services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fortimetal
      POSTGRES_PASSWORD: fortimetal
      POSTGRES_DB: fortimetal_db
    ports:
      - "5432:5432"
    volumes:
      - fortimetal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortimetal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fortimetal:fortimetal@db:5432/fortimetal_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fortimetal_pgdata:
